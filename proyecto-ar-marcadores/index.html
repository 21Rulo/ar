<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo WebAR - Marcadores</title>
    <link rel="stylesheet" href="style.css">

    <!-- Cargamos A-Frame y el sistema de Image Tracking de MindAR desde CDN -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
    <!-- Pantalla de carga: se muestra mientras MindAR descarga el modelo y abre la cámara -->
    <div id="ar-loader" role="status" aria-live="polite">
        <div class="scanner-frame">
            <span class="corner tl"></span><span class="corner tr"></span>
            <span class="corner bl"></span><span class="corner br"></span>
            <div class="scan-line"></div>
        </div>
        <p id="loader-text">Calibrando escáner AR...</p>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>

    <!-- Botón para activar el audio (solo aparece cuando el video ya está sobre el póster) -->
    <button id="sound-button" type="button" hidden>🔊 Activar sonido</button>

    <!-- Interfaz de usuario superior para estados -->
    <div id="ui-overlay">
        <h1>Escaner WebAR Activo 📷</h1>
        <p id="status-text">Apunta la webcam al póster en tu celular...</p>
    </div>

    <!-- Escena de Realidad Aumentada de MindAR -->
    <!-- 'imageTargetSrc' apunta al archivo compilado de tu póster -->
    <a-scene mindar-image="imageTargetSrc: public/targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: no;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- Pre-cargamos el video para controlarlo por código -->
            <video id="ar-video" src="public/video.mp4" response-type="arraybuffer" loop muted playsinline
                webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Este contenedor vincula el contenido al marcador 0 (tu primer póster) -->
        <a-entity id="portfolio-target" mindar-image-target="targetIndex: 0">
            <!-- Dibujamos un plano plano encima del póster que proyectará el video -->
            <!-- El aspecto por defecto es 1x1 (cuadrado), ajustaremos el ancho/alto según el video -->
            <a-video id="video-screen" src="#ar-video" width="1" height="0.75" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script type="module" src="app.js"></script>
</body>

</html>
